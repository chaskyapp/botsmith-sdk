[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chasky-botsmith"
version = "0.0.0"
description = "Client SDK for the Chasky Bot API"
readme = "README.md"
requires-python = ">=3.11"
# httpx is the ONLY dependency, and it is not a default reached for lightly.
# Go and Node ship async HTTP in their standard library; Python does not. The
# alternative is urllib on a thread pool, and a 30-second long poll blocking a
# thread with poor cancellation is worse than one well-maintained dependency.
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/chaskyapp/botsmith-sdk"

[tool.hatch.build.targets.wheel]
packages = ["chasky_botsmith"]
