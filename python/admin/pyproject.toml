[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chasky-botsmith-admin"
version = "0.0.0"
description = "BotSmith administration client. Requires the Chasky platform secret — NOT for bot authors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/chaskyapp/botsmith-sdk"

[tool.hatch.build.targets.wheel]
packages = ["chasky_botsmith_admin"]
