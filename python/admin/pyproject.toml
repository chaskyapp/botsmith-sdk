[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chasky-botsmith-admin"
version = "0.1.0"
description = "BotSmith administration client. Authenticates with a developer key (sk_...) — NOT for bot authors."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.1"]

[project.urls]
Repository = "https://github.com/chaskyapp/botsmith-sdk"

[tool.hatch.build.targets.wheel]
packages = ["chasky_botsmith_admin"]
